<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoreStay PMS</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#17203a;--mu:#6b7690;--pr:#4f46e5;--pr2:#7c3aed;--ok:#059669;--wa:#d97706;--er:#dc2626;--bd:#e4e8f2}
@media(prefers-color-scheme:dark){:root{--bg:#0e1325;--card:#171d35;--tx:#e8ecf8;--mu:#93a0c0;--bd:#262e4d}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
nav{width:230px;background:linear-gradient(180deg,#1e1b4b,#312e81);color:#e0e7ff;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font-size:18px;margin:4px 10px 14px;color:#fff}nav h1 small{display:block;font-size:11px;font-weight:400;opacity:.7}
nav a{display:block;padding:8px 12px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;margin:1px 0}nav a:hover{background:#ffffff1f}nav a.on{background:#fff;color:#312e81;font-weight:600}
nav b{display:block;font-size:10px;letter-spacing:.1em;opacity:.55;margin:12px 12px 4px}
main{flex:1;padding:22px;min-width:0}h2{margin:0 0 4px}.sub{color:var(--mu);margin-bottom:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}.k{color:var(--mu);font-size:12px}.v{font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}.w{overflow-x:auto}.r{text-align:right}
button,input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;cursor:pointer}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}.f label{font-size:11px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
.t{padding:2px 8px;border-radius:99px;font-size:11px;background:#e0e7ff;color:#3730a3}.t.ok{background:#d1fae5;color:#065f46}.t.wa{background:#fef3c7;color:#92400e}.t.er{background:#fee2e2;color:#991b1b}
.fl{font-size:12px;color:var(--mu);background:var(--bg);padding:8px 10px;border-radius:8px;margin-bottom:12px}
@media(max-width:760px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap}nav b,nav h1{width:100%}}
</style>
</head><body><nav id="nav"></nav><main id="app"></main><script src="seed.js"></script><script src="app.js"></script></body></html>
