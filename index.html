<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f1e">
<title>CoreStay PMS</title>
<style>
:root{color-scheme:dark;--bg:#080f1e;--panel:#101b2d;--card:#132238;--card2:#172a40;--tx:#edf4fb;--mu:#91a4b9;--pr:#17a6a0;--pr2:#b99555;--ok:#35c49a;--wa:#e4b65e;--er:#ed737b;--bd:#263b52;--shadow:0 18px 48px #02081399}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;display:block;background:radial-gradient(ellipse at 82% -18%,#173b50 0,transparent 40%),var(--bg);color:var(--tx);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#cs-shell{position:sticky;top:0;z-index:100;background:#0c1728f2;border-bottom:1px solid #294157;box-shadow:0 8px 28px #02081370;backdrop-filter:blur(16px);display:grid;grid-template-columns:240px 1fr auto;align-items:center;padding:13px 26px 0;gap:20px}
.cs-brand{display:flex;align-items:center;gap:11px;padding-bottom:12px}.cs-mark{width:37px;height:37px;display:grid;place-items:center;border:1px solid #b99555;border-radius:11px;color:#e0bd78;font:700 22px Georgia,serif;background:linear-gradient(145deg,#1c3850,#101c2c);box-shadow:inset 0 0 18px #b9955520}
.cs-brand strong{display:block;letter-spacing:.17em;font:700 15px Georgia,serif}.cs-brand small{display:block;color:#b99555;font-size:8px;letter-spacing:.16em;margin-top:3px}
.cs-hotel{color:#c5d3e1;font-size:11px;letter-spacing:.07em;align-self:center}.cs-hotel small{color:#8298ad;font-size:10px}.cs-hotel b{color:#e5c17c;font-weight:600}.cs-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35c49a;box-shadow:0 0 10px #35c49a;margin-right:8px}
.cs-user{display:flex;align-items:center;gap:9px;color:#c5d3e1;font-size:11px;white-space:nowrap;padding-bottom:12px}.cs-avatar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#23415a;color:#e7c785;font-weight:700;border:1px solid #54718a}.cs-bell{font-size:17px;color:#d6bd8c}
.cs-nav{grid-column:1/-1;display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:thin;border-top:1px solid #20354a}
.cs-nav-btn{border:0!important;border-radius:0!important;background:transparent!important;color:#aebfd0!important;padding:14px 15px!important;font-size:10px!important;letter-spacing:.09em;font-weight:700;white-space:nowrap;border-bottom:2px solid transparent!important}
.cs-nav-btn span{color:#c6a86c;margin-left:5px}.cs-nav-btn:hover,.cs-nav-btn.active{color:#f2d69b!important;background:#ffffff08!important;border-bottom-color:#c09b59!important}
.cs-menu-panel{position:absolute;top:100%;left:240px;right:24px;padding:20px 24px 24px;background:#101e30;border:1px solid #30485e;border-top:2px solid #b99555;border-radius:0 0 16px 16px;box-shadow:var(--shadow);z-index:110}
.cs-menu-panel[hidden]{display:none}.cs-menu-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.cs-menu-head small{font-size:9px;letter-spacing:.16em;color:#c4a365}.cs-menu-head h3{font-size:15px;letter-spacing:.08em;margin:5px 0 0}.cs-menu-head>span{color:#849bb0;font-size:11px}
.cs-menu-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:9px}
.cs-menu-item{display:flex;align-items:center;gap:10px;text-align:left;background:#172a40!important;border:1px solid #2a4259!important;border-radius:10px!important;color:#dce8f2!important;padding:13px!important;min-height:49px;transition:.18s}
.cs-menu-item:hover{background:#1d3850!important;border-color:#b99555!important;transform:translateY(-1px)}
.cs-menu-item b{margin-left:auto;color:#c7a96c;font-size:16px}.cs-menu-dot{width:7px;height:7px;flex:none;border-radius:50%;background:#25aaa3;box-shadow:0 0 9px #25aaa366}
#app{max-width:1600px;margin:0 auto;padding:27px 30px 48px;min-width:0}
h1,h2,h3,h4{color:#f0f5fb}h2{font-size:23px;letter-spacing:-.02em;margin:0 0 5px}.sub{color:var(--mu);margin:0 0 20px;font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:18px}
.c{background:linear-gradient(145deg,#14263b,#101d30);border:1px solid var(--bd);border-radius:14px;padding:17px;margin-bottom:15px;box-shadow:0 8px 24px #02081325}
.k{color:var(--mu);font-size:11px;letter-spacing:.03em}.v{font-size:24px;font-weight:700;color:#f2d69b;margin-top:5px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid #263b52;white-space:nowrap}th{color:#9bb0c4;font-size:10px;text-transform:uppercase;letter-spacing:.08em}td{color:#d6e1eb;font-size:12px}tbody tr:hover{background:#ffffff06}.w{overflow-x:auto;border-radius:9px}.r{text-align:right}
button,input,select{font:inherit;padding:9px 11px;border-radius:8px;border:1px solid #30465d;background:#0e1b2c;color:var(--tx)}
button{background:linear-gradient(135deg,#147f82,#1ba6a0);color:#fff;border:1px solid #36b6ad;cursor:pointer;font-weight:600}button:hover{filter:brightness(1.12)}button.s{background:#172a40;color:#dce8f2;border:1px solid #344d64}
input:focus,select:focus{outline:2px solid #1ba6a077;border-color:#1ba6a0}
.f{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px;align-items:end}.f label{font-size:10px;color:#9bb0c4;display:flex;flex-direction:column;gap:5px}
.t{padding:3px 9px;border-radius:99px;font-size:10px;background:#243b55;color:#c5d8ed}.t.ok{background:#153f3b;color:#75e0bd}.t.wa{background:#493a20;color:#f1ce80}.t.er{background:#48282f;color:#ff9da4}
.fl{font-size:11px;color:#b5c5d4;background:#0d1a2a;padding:10px 12px;border:1px solid #263b52;border-radius:8px;margin-bottom:13px}
#app .c>b{display:block;margin-bottom:10px;color:#e9d09c}
@media(max-width:900px){#cs-shell{grid-template-columns:1fr auto;padding:12px 15px 0;gap:8px}.cs-hotel{grid-column:1/-1;grid-row:2;padding:0 0 10px}.cs-user{grid-column:2;grid-row:1}.cs-nav{grid-column:1/-1}.cs-menu-panel{left:10px;right:10px}.cs-menu-grid{grid-template-columns:repeat(2,minmax(130px,1fr))}#app{padding:20px 15px 36px}}
@media(max-width:520px){.cs-brand small{font-size:7px}.cs-user{font-size:0}.cs-user .cs-avatar{font-size:10px}.cs-nav-btn{padding:12px 10px!important;font-size:9px!important}.cs-menu-grid{grid-template-columns:1fr 1fr}.cs-menu-panel{padding:15px}.cs-menu-head>span{display:none}#app{padding:17px 11px 30px}.g{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<nav id="nav" aria-label="Legacy navigation"></nav>
<main id="app" aria-live="polite"></main>
<script src="seed.js"></script>
<script src="app.js"></script>
<script src="shell.js"></script>
</body>
</html>
